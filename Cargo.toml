[package]
name = "raminfo"
version = "0.3.0"
edition = "2024"
description = "Cross-platform RAM inspector — interactive TUI, DIMM slots, model, frequency, temperatures, usage stats and top consumers"
license = "MIT"
repository = "https://github.com/swayoleg/raminfo"
keywords = ["ram", "memory", "cli", "tui", "ddr"]
categories = ["command-line-utilities"]
readme = "README.md"


[dependencies]
colored = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
ratatui = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
